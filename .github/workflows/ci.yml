name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test and Security Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .

      - name: Install test and security tools
        run: python -m pip install pytest bandit pip-audit

      - name: Run tests
        run: pytest -q

      - name: Run Bandit
        run: bandit -r soc_agent_toolkit -ll

      - name: Run pip-audit
        run: pip-audit
