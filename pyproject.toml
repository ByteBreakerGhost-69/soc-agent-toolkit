[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-agent-toolkit"
version = "0.1.0"
description = "AI-assisted SOC alert triage and incident analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Maulana Yasyfa'u Al Azhiim Yudho Leksono" }
]

license = "MIT"

keywords = [
    "soc",
    "security",
    "cybersecurity",
    "incident-response",
    "threat-detection",
    "mitre-attack",
    "ioc",
    "ai",
    "cli",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.31",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/ByteBreakerGhost-69/soc-agent-toolkit"
Repository = "https://github.com/ByteBreakerGhost-69/soc-agent-toolkit"
Issues = "https://github.com/ByteBreakerGhost-69/soc-agent-toolkit/issues"

[project.scripts]
soc-agent = "soc_agent_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["soc_agent_toolkit*"]
