[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-agent-toolkit"
version = "0.1.0"
description = "AI-assisted SOC alert triage and incident analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "rich>=15.0.0",
]

[project.scripts]
soc-agent = "soc_agent_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["soc_agent_toolkit*"]
